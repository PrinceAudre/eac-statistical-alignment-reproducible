name: Paper 2 R figure refresh

on:
  push:
    branches:
      - paper2-finalize-20261015
    paths:
      - analysis/paper2_reproduce_all_final_analysis.R
      - analysis/Paper2_R_Analysis_Compact_127.csv
      - analysis/Paper2_R_Reliability_Clean_26.csv
      - analysis/Paper2_R_Strata_Clean.csv
      - .github/workflows/paper2-r-figure-refresh.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reproduce:
    runs-on: windows-latest

    steps:
      - name: Check out finalization branch
        uses: actions/checkout@v4
        with:
          ref: paper2-finalize-20261015

      - name: Set up R 4.6.0
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.0'
          use-public-rspm: true

      - name: Install analysis dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::survey
            any::readr
            any::dplyr
            any::tidyr
            any::ggplot2
            any::scales
            any::tibble

      - name: Run complete Paper 2 analysis
        shell: pwsh
        run: |
          Set-Location analysis
          Rscript paper2_reproduce_all_final_analysis.R

      - name: Verify numerical outputs did not drift
        shell: pwsh
        run: |
          @'
          import csv
          import io
          import math
          import pathlib
          import subprocess
          import sys

          paths = subprocess.check_output(
              ["git", "ls-files", "analysis/outputs/*.csv"],
              text=True
          ).splitlines()

          failures = []

          def as_number(value):
              try:
                  number = float(value)
                  if math.isfinite(number):
                      return number
              except ValueError:
                  pass
              return None

          def rounding_tolerance(reference_text):
              text = reference_text.strip().lower()
              if "e" in text:
                  mantissa, exponent = text.split("e", 1)
                  decimals = len(mantissa.split(".", 1)[1]) if "." in mantissa else 0
                  return 0.5000001 * (10.0 ** (int(exponent) - decimals)) + 1e-12
              if "." in text:
                  decimals = len(text.split(".", 1)[1])
                  return 0.5000001 * (10.0 ** (-decimals)) + 1e-12
              return 1e-12

          for path in paths:
              baseline = subprocess.check_output(
                  ["git", "show", f"HEAD:{path}"],
                  text=True
              )
              regenerated = pathlib.Path(path).read_text(encoding="utf-8")

              old_rows = list(csv.reader(io.StringIO(baseline)))
              new_rows = list(csv.reader(io.StringIO(regenerated)))

              if len(old_rows) != len(new_rows):
                  failures.append(
                      f"{path}: row count changed {len(old_rows)} -> {len(new_rows)}"
                  )
                  continue

              for row_index, (old_row, new_row) in enumerate(
                  zip(old_rows, new_rows), start=1
              ):
                  if len(old_row) != len(new_row):
                      failures.append(
                          f"{path}:{row_index}: column count changed "
                          f"{len(old_row)} -> {len(new_row)}"
                      )
                      continue

                  for col_index, (old_value, new_value) in enumerate(
                      zip(old_row, new_row), start=1
                  ):
                      if old_value == new_value:
                          continue

                      old_number = as_number(old_value)
                      new_number = as_number(new_value)

                      if old_number is not None and new_number is not None:
                          tolerance = rounding_tolerance(old_value)
                          if abs(old_number - new_number) <= tolerance:
                              continue

                      failures.append(
                          f"{path}:{row_index}:{col_index}: "
                          f"{old_value!r} -> {new_value!r}"
                      )

          if failures:
              print("Numerical/content drift detected after R reproduction:")
              for failure in failures[:100]:
                  print("  " + failure)
              if len(failures) > 100:
                  print(f"  ... plus {len(failures) - 100} more differences")
              sys.exit(1)

          print(
              "PASS: regenerated CSVs are semantically identical to the "
              "tracked numerical snapshot, allowing only previously rounded "
              "numeric formatting and CSV quoting/line-ending differences."
          )
          '@ | python -

      - name: Commit regenerated figures
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/outputs/Figure1_overall_alignment.pdf
          git add analysis/outputs/Figure1_overall_alignment.eps
          git add analysis/outputs/Figure1_overall_alignment.png
          git add analysis/outputs/Figure2_domain_states.pdf
          git add analysis/outputs/Figure2_domain_states.eps
          git add analysis/outputs/Figure2_domain_states.png
          git add analysis/outputs/Supplementary_Figure_S1_sentinel_indicators.pdf
          git add analysis/outputs/Supplementary_Figure_S1_sentinel_indicators.eps
          git add analysis/outputs/Supplementary_Figure_S1_sentinel_indicators.png
          if (-not (git diff --cached --quiet)) {
            git commit -m "Regenerate final Paper 2 figures [skip ci]"
            git push origin HEAD:paper2-finalize-20261015
          } else {
            Write-Host "Figures already match the regenerated outputs."
          }
